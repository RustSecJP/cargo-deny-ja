seo_title: cargo-deny の本（Embark Studios「cargo-deny」公式ドキュメント日本語訳）
summary: Rust の依存クレートについて、既知の脆弱性の助言、使ってはいけないクレート、ライセンス、取得元を確かめるツール「cargo-deny」（Embark Studios）の公式ドキュメントの、非公式な日本語訳。コマンドと、advisories・bans・licenses・sources の 4 つの確認の設定と診断を全文訳している。
